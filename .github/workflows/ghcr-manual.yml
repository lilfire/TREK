name: GHCR Manual Build & Push
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0 or latest)'
        type: string
        required: true
        default: 'latest'
jobs:
  build-tagged:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}
          labels: |
            org.opencontainers.image.description=TREK - A self-hosted trip planning application
            org.opencontainers.image.documentation=https://github.com/lilfire/TREK/blob/main/CHANGELOG.md
            org.opencontainers.image.source=https://github.com/lilfire/TREK
  build-latest:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.description=TREK - A self-hosted trip planning application
            org.opencontainers.image.documentation=https://github.com/lilfire/TREK/blob/main/CHANGELOG.md
            org.opencontainers.image.source=https://github.com/lilfire/TREK
