name: GHCR Manual Build & Push
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0 or latest)'
        type: string
        required: true
        default: 'latest'
jobs:
  build-tagged:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Derive app version
        env:
          TAG: ${{ github.event.inputs.tag }}
        # The UI prefixes the version with "v", so strip a leading one here.
        run: echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TREK - A self-hosted trip planning application
            org.opencontainers.image.documentation=https://github.com/lilfire/TREK/wiki
            org.opencontainers.image.source=https://github.com/lilfire/TREK
  build-latest:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=latest-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TREK - A self-hosted trip planning application
            org.opencontainers.image.documentation=https://github.com/lilfire/TREK/wiki
            org.opencontainers.image.source=https://github.com/lilfire/TREK
