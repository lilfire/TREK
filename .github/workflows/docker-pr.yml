name: Docker Build Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - 'server/**'
      - 'client/**'
      - '.github/workflows/docker-pr.yml'

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trek:ci-test
          build-args: |
            APP_VERSION=ci-test
